# Requisitos de inscripción y participación, tal como aparecen en las bases oficiales (PDF).
# seccion: economicos | registro | cancha | conducta
- { id: "01", numero: 1, seccion: economicos, titulo: Inscripción, texto: "Cubrir la cantidad de $4,500.00 MXN por equipo, proponiendo 3 pagos de $1,500 los días 9, 16 y 30 de octubre; pudiendo liquidar antes si así lo prefiere el delegado representante." }
- { id: "02", numero: 2, seccion: economicos, titulo: Fecha límite de inscripción, texto: "1 de noviembre de 2026. La participación quedará confirmada únicamente cuando se haya cubierto el proceso de inscripción correspondiente." }
- { id: "03", numero: 3, seccion: cancha, titulo: Campo local, texto: "Cada equipo deberá contar con un campo local disponible y en condiciones adecuadas para la realización de los partidos que le correspondan como local. La sede deberá ser informada previamente a la organización; de no contar con un campo se le asignará uno (no todos los partidos serán de local)." }
- { id: "04", numero: 4, seccion: registro, titulo: Identidad del equipo, texto: "Entregar el nombre oficial y logotipo del equipo en buena calidad, los cuales serán utilizados para calendario, estadísticas, resultados, publicaciones y material oficial de la Supercopa." }
- { id: "05", numero: 5, seccion: registro, titulo: Plantilla, texto: "Cada equipo podrá registrar un máximo de 25 jugadores. Únicamente podrán participar jugadores debidamente registrados y acreditados ante la organización." }
- { id: "06", numero: 6, seccion: economicos, titulo: Registro de jugadores, texto: "Cubrir un costo de $400 MXN por equipo completo contando delegados. La documentación y datos requeridos deberán entregarse dentro del periodo establecido por la organización." }
- { id: "07", numero: 7, seccion: registro, titulo: Delegados, texto: "Registrar hasta 4 delegados o integrantes de cuerpo técnico, quienes serán las únicas personas, además de los jugadores registrados, autorizadas para permanecer en el área de banca. Sólo se podrá ingresar una persona más como preparador físico que tenga la manera de comprobar su actividad para y con el equipo." }
- { id: "08", numero: 8, seccion: cancha, titulo: Uniforme, texto: "Todos los jugadores deberán presentarse con uniforme completo y debidamente identificado con su equipo, incluyendo playera, short, medias y calzado apropiado. Se recomienda contar con uniforme alternativo o casacas en caso de similitud de colores." }
- { id: "09", numero: 9, seccion: cancha, titulo: Numeración, texto: "Los jugadores deberán portar un número visible en el uniforme, procurando mantener la misma numeración durante la competencia para facilitar su identificación." }
- { id: "10", numero: 10, seccion: economicos, titulo: Arbitraje, texto: "Cada equipo deberá cubrir el costo de arbitraje correspondiente a sus partidos, establecido en $800 MXN, de acuerdo con las indicaciones y tiempos determinados por la organización. El costo del arbitraje de la final será de $1,300 por equipo." }
- { id: "11", numero: 11, seccion: cancha, titulo: Balones, texto: "El equipo local deberá presentar 3 balones reglamentarios en buen estado antes del inicio del encuentro." }
- { id: "12", numero: 12, seccion: conducta, titulo: Acceso a cancha y bancas, texto: "Queda restringido el acceso al terreno de juego y zona de bancas a cualquier persona que no se encuentre debidamente registrada. En la banca únicamente podrán permanecer los jugadores registrados y un máximo de 4 integrantes del cuerpo técnico/delegados, más el preparador físico antes mencionado." }
- { id: "13", numero: 13, seccion: conducta, titulo: Seguridad, texto: "Independientemente de que algunas sedes cuenten con personal de seguridad y otras no, los equipos serán responsables del comportamiento de sus jugadores, cuerpo técnico y acompañantes. Ninguna persona ajena a los registros autorizados podrá ingresar al terreno de juego o área de bancas." }
- { id: "14", numero: 14, seccion: registro, titulo: Documentación, texto: "Cada jugador deberá presentar la documentación o identificación que determine la organización para comprobar su registro cuando le sea solicitada." }
- { id: "15", numero: 15, seccion: cancha, titulo: Puntualidad, texto: "Los equipos deberán presentarse 15 minutos antes para realizar revisión de registros, uniformes y demás protocolo previo al encuentro." }
- { id: "16", numero: 16, seccion: registro, titulo: Responsabilidad del delegado, texto: "Cada equipo deberá designar a un delegado responsable como enlace oficial con la organización. Los avisos, horarios, sanciones, modificaciones y comunicados enviados a dicho representante se considerarán oficialmente recibidos por el equipo." }
- { id: "17", numero: 17, seccion: conducta, titulo: Reglamento, texto: "La inscripción y participación en la Supercopa implica la aceptación del reglamento general de competencia, así como de las decisiones disciplinarias y administrativas emitidas conforme al mismo." }
- { id: "18", numero: 18, seccion: conducta, titulo: Conducta deportiva, texto: "Jugadores, delegados, cuerpo técnico y acompañantes deberán mantener una conducta de respeto hacia árbitros, rivales, organización, instalaciones y público. Cualquier acto de violencia o conducta grave será turnado a la organización para determinar la sanción correspondiente." }
- { id: "19", numero: 19, seccion: conducta, titulo: Programación, texto: "Los equipos participantes deberán respetar los días, horarios y sedes establecidos en el calendario oficial. Cualquier solicitud de modificación estará sujeta a autorización de la organización y a las disposiciones del reglamento." }
- { id: "20", numero: 20, seccion: registro, titulo: Registro cerrado, texto: "Una vez concluido el periodo oficial de registro de jugadores, no podrán realizarse altas, bajas, sustituciones o cambios de equipo, salvo los casos expresamente contemplados por el reglamento de competencia." }
- { id: "21", numero: 21, seccion: cancha, titulo: Tolerancia, texto: "Los jugadores y delegados deberán estar en el campo 15 minutos antes del encuentro, a lo cual se revisarán los registros, teniendo los jugadores como tolerancia para entrar medio tiempo de juego." }
